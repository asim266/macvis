name: Release

# Build & publish a signed (if secrets are present) macOS DMG to a GitHub Release
# when a v* tag is pushed, e.g.  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Build renderer + main bundles
        run: pnpm exec electron-vite build --config electron-vite.config.ts

      - name: Build & publish DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing (optional) — set these repo secrets to produce a signed+notarized build.
          # Without them, electron-builder produces an unsigned DMG.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --mac --publish always
